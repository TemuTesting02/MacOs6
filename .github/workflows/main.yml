name: Mac Remote - Tailscale + RustDesk

on:
  workflow_dispatch:

jobs:
  remote:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Verify passwordless admin
        shell: bash
        run: |
          set -euo pipefail

          if ! sudo -n true 2>/dev/null; then
            echo "ERROR: Passwordless sudo is not available."
            echo "No interactive password prompt will be opened."
            exit 1
          fi

          echo "Passwordless sudo is available."
          sudo -n id

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verify Tailscale and get VPN IP
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..20}; do
            TS_IP="$(tailscale ip -4 2>/dev/null || true)"

            if [[ "$TS_IP" =~ ^100\. ]]; then
              echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
              echo "Tailscale VPN IP: $TS_IP"
              tailscale status
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Tailscale IPv4 was not detected."
          tailscale status || true
          exit 1

      - name: Download RustDesk DMG
        shell: bash
        run: |
          set -euo pipefail

          python3 > "$RUNNER_TEMP/rustdesk_url" <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/rustdesk/rustdesk/releases/latest",
              headers={"User-Agent": "GitHub-Actions"}
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)

          preferred = []
          fallback = []

          for asset in release.get("assets", []):
              name = asset["name"]
              low = name.lower()

              if not low.endswith(".dmg"):
                  continue

              fallback.append(asset["browser_download_url"])

              if "arm64" in low or "aarch64" in low:
                  preferred.append(asset["browser_download_url"])

          url = (preferred or fallback or [None])[0]

          if not url:
              raise SystemExit("No RustDesk DMG found.")

          print(url)
          PY

          URL="$(cat "$RUNNER_TEMP/rustdesk_url")"

          curl -fL --retry 3 "$URL" \
            -o "$RUNNER_TEMP/RustDesk.dmg"

          test -s "$RUNNER_TEMP/RustDesk.dmg"

          echo "RustDesk DMG downloaded."

      - name: Install RustDesk without GUI installer
        shell: bash
        run: |
          set -euo pipefail

          MOUNT="$RUNNER_TEMP/rustdesk_mount"
          APP="/Applications/RustDesk.app"

          mkdir -p "$MOUNT"

          hdiutil attach \
            "$RUNNER_TEMP/RustDesk.dmg" \
            -mountpoint "$MOUNT" \
            -nobrowse \
            -readonly \
            -quiet

          cleanup() {
            hdiutil detach "$MOUNT" -quiet 2>/dev/null || true
          }

          trap cleanup EXIT

          SOURCE="$(find "$MOUNT" -maxdepth 2 \
            -name 'RustDesk.app' \
            -type d \
            -print -quit)"

          if [ -z "$SOURCE" ]; then
            echo "ERROR: RustDesk.app was not found."
            exit 1
          fi

          sudo -n rm -rf "$APP"
          sudo -n ditto "$SOURCE" "$APP"
          sudo -n chown -R root:wheel "$APP"

          test -x "$APP/Contents/MacOS/RustDesk"

          echo "RustDesk installed."
          echo "No Installer.app was used."

      - name: Install RustDesk service
        shell: bash
        run: |
          set -euo pipefail

          BIN="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          sudo -n "$BIN" --install-service

          sleep 5

          echo "RustDesk service installed."

      - name: Set temporary RustDesk password
        shell: bash
        run: |
          set -euo pipefail

          BIN="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          PASS="$(openssl rand -hex 8)"

          echo "Setting temporary RustDesk password..."

          OUTPUT="$(
            sudo -n "$BIN" --password "$PASS" 2>&1
          )" || {
            echo "$OUTPUT"
            echo "ERROR: RustDesk rejected the password."
            exit 1
          }

          echo "$OUTPUT"

          if ! echo "$OUTPUT" | grep -qi "done"; then
            echo "ERROR: RustDesk did not confirm the password change."
            exit 1
          fi

          echo "RUSTDESK_PASSWORD=$PASS" >> "$GITHUB_ENV"

          echo "RustDesk password configured."

      - name: Start RustDesk in user session
        shell: bash
        run: |
          set -euo pipefail

          APP="/Applications/RustDesk.app"

          nohup open -a "$APP" \
            >/tmp/rustdesk-open.log 2>&1 &

          disown || true

          sleep 10

          if ! pgrep -x RustDesk >/dev/null 2>&1; then
            echo "ERROR: RustDesk GUI did not start."
            cat /tmp/rustdesk-open.log || true
            exit 1
          fi

          echo "RustDesk GUI is running."

      - name: Get and verify RustDesk ID
        shell: bash
        run: |
          set -euo pipefail

          BIN="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          ID=""

          for i in {1..20}; do
            ID="$(
              "$BIN" --get-id 2>/dev/null |
              tr -cd '0-9' || true
            )"

            if [[ "$ID" =~ ^[0-9]{6,}$ ]]; then
              break
            fi

            echo "Waiting for RustDesk ID... $i/20"
            sleep 3
          done

          if ! [[ "$ID" =~ ^[0-9]{6,}$ ]]; then
            echo "ERROR: RustDesk ID was not detected."
            exit 1
          fi

          echo "RUSTDESK_ID=$ID" >> "$GITHUB_ENV"

          echo "RustDesk ID verified: $ID"

      - name: Verify final status
        shell: bash
        run: |
          set -euo pipefail

          if ! pgrep -x RustDesk >/dev/null 2>&1; then
            echo "ERROR: RustDesk is not running."
            exit 1
          fi

          echo "RustDesk: RUNNING"
          echo "RustDesk ID: $RUSTDESK_ID"
          echo "Tailscale VPN IP: $TS_IP"

          echo
          echo "Tailscale status:"
          tailscale status

      - name: Connection Information
        shell: bash
        run: |
          echo
          echo "================================================"
          echo "           CONNECTION INFORMATION"
          echo "================================================"
          echo
          echo "RustDesk Status   : RUNNING"
          echo "RustDesk ID       : $RUSTDESK_ID"
          echo "RustDesk Password : $RUSTDESK_PASSWORD"
          echo "Tailscale VPN IP  : $TS_IP"
          echo
          echo "================================================"
          echo

      - name: Keep Mac running
        shell: bash
        run: |
          set -euo pipefail

          caffeinate -dimsu &
          CAFFEINATE_PID=$!

          trap 'kill "$CAFFEINATE_PID" 2>/dev/null || true' EXIT

          while true; do
            if ! pgrep -x RustDesk >/dev/null 2>&1; then
              echo "ERROR: RustDesk stopped."
              exit 1
            fi

            sleep 60
          done
