name: remote

on:
  workflow_dispatch:

jobs:
  remote:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. Setup
      # ============================================================
      - name: Set up job
        shell: bash
        run: |
          set -euo pipefail

          echo "macOS: $(sw_vers -productVersion)"
          echo "User: $(whoami)"
          echo "UID: $(id -u)"

          if ! sudo -n true 2>/dev/null; then
            echo "ERROR: passwordless sudo is not available."
            exit 1
          fi

          echo "Administrator privileges: OK"

      # ============================================================
      # 2. Tailscale
      # ============================================================
      - name: Connect Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail

          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "ERROR: GitHub Secret TS_AUTHKEY is missing."
            exit 1
          fi

          echo "Installing Tailscale..."

          brew install --quiet tailscale

          echo "Starting Tailscale..."

          sudo launchctl load \
            /Library/LaunchDaemons/com.tailscale.tailscaled.plist \
            2>/dev/null || true

          sudo launchctl kickstart \
            -k system/com.tailscale.tailscaled \
            2>/dev/null || true

          sleep 5

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-macos-rustdesk"

          sleep 5

          echo "Tailscale status:"
          tailscale status || sudo tailscale status

      # ============================================================
      # 3. Get VPN IP
      # ============================================================
      - name: Verify Tailscale and get VPN IP
        shell: bash
        run: |
          set -euo pipefail

          TS_IP=""

          for i in {1..20}; do
            TS_IP="$(tailscale ip -4 2>/dev/null || true)"

            if [ -n "$TS_IP" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale VPN IP was not obtained."
            tailscale status || true
            exit 1
          fi

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

          echo "Tailscale VPN IP: $TS_IP"

      # ============================================================
      # 4. Download RustDesk DMG
      # ============================================================
      - name: Download RustDesk DMG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/rustdesk"

          cd "$RUNNER_TEMP/rustdesk"

          echo "Downloading RustDesk..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -o RustDesk.dmg \
            https://github.com/rustdesk/rustdesk/releases/latest/download/rustdesk.dmg

          test -s RustDesk.dmg

          echo "RustDesk DMG downloaded."

      # ============================================================
      # 5. Install without Installer.app
      # ============================================================
      - name: Install RustDesk without GUI installer
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/rustdesk"

          echo "Mounting RustDesk DMG..."

          MOUNT_POINT="$RUNNER_TEMP/rustdesk/mount"

          mkdir -p "$MOUNT_POINT"

          hdiutil attach RustDesk.dmg \
            -nobrowse \
            -mountpoint "$MOUNT_POINT"

          echo "Searching for RustDesk.app..."

          APP_SOURCE="$(find "$MOUNT_POINT" \
            -maxdepth 2 \
            -name "RustDesk.app" \
            -type d \
            -print -quit)"

          if [ -z "$APP_SOURCE" ]; then
            echo "ERROR: RustDesk.app not found."
            hdiutil detach "$MOUNT_POINT" || true
            exit 1
          fi

          echo "Installing RustDesk.app..."

          sudo rm -rf /Applications/RustDesk.app

          sudo ditto \
            "$APP_SOURCE" \
            /Applications/RustDesk.app

          sudo chown -R root:wheel \
            /Applications/RustDesk.app

          hdiutil detach "$MOUNT_POINT" || true

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -x "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable not found."
            exit 1
          fi

          echo "RustDesk installed successfully."

      # ============================================================
      # 6. Prepare USER config directory
      # ============================================================
      - name: Prepare RustDesk user configuration
        shell: bash
        run: |
          set -euo pipefail

          VNC_USER="$(whoami)"
          USER_HOME="$HOME"

          RUSTDESK_CONFIG="$USER_HOME/Library/Preferences/com.carriez.RustDesk"

          echo "User: $VNC_USER"
          echo "Home: $USER_HOME"
          echo "Config: $RUSTDESK_CONFIG"

          mkdir -p "$RUSTDESK_CONFIG"

          chmod 700 "$RUSTDESK_CONFIG"

          chown "$VNC_USER":staff \
            "$RUSTDESK_CONFIG"

          echo "RUSTDESK_CONFIG=$RUSTDESK_CONFIG" >> "$GITHUB_ENV"

      # ============================================================
      # 7. Start RustDesk in user session
      # ============================================================
      - name: Start RustDesk in user session
        shell: bash
        run: |
          set -euo pipefail

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "Stopping old RustDesk processes..."

          pkill -x RustDesk 2>/dev/null || true

          sleep 2

          echo "Starting RustDesk..."

          open -a /Applications/RustDesk.app

          sleep 10

          if pgrep -x RustDesk >/dev/null; then
            echo "RustDesk GUI/user session is running."
          else
            echo "WARNING: RustDesk GUI process was not detected."
          fi

      # ============================================================
      # 8. Create temporary password
      # ============================================================
      - name: Set temporary RustDesk password
        shell: bash
        run: |
          set -euo pipefail

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "Preparing temporary RustDesk password..."

          RUSTDESK_PASS="$(
            LC_ALL=C tr -dc 'A-Za-z0-9' \
            </dev/urandom | head -c 16
          )"

          if [ -z "$RUSTDESK_PASS" ]; then
            echo "ERROR: Could not generate password."
            exit 1
          fi

          echo "::add-mask::$RUSTDESK_PASS"

          echo "Setting password using RustDesk CLI..."

          mkdir -p "$RUSTDESK_CONFIG"

          chown -R "$(whoami)":staff \
            "$RUSTDESK_CONFIG"

          "$RUSTDESK" \
            --password "$RUSTDESK_PASS"

          sleep 5

          echo "RUSTDESK_PASS=$RUSTDESK_PASS" >> "$GITHUB_ENV"

          echo "RustDesk password command completed."

      # ============================================================
      # 9. Get RustDesk ID
      # ============================================================
      - name: Get and verify RustDesk ID
        shell: bash
        run: |
          set -euo pipefail

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          RUSTDESK_ID=""

          for i in {1..30}; do

            RUSTDESK_ID="$(
              "$RUSTDESK" --get-id 2>/dev/null |
              tr -cd '0-9'
            )"

            if [ -n "$RUSTDESK_ID" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$RUSTDESK_ID" ]; then
            echo "ERROR: RustDesk ID was not obtained."

            "$RUSTDESK" --get-id || true

            exit 1
          fi

          echo "RUSTDESK_ID=$RUSTDESK_ID" >> "$GITHUB_ENV"

          echo "RustDesk ID: $RUSTDESK_ID"

      # ============================================================
      # 10. Verify RustDesk status
      # ============================================================
      - name: Verify RustDesk status
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RustDesk processes..."

          if pgrep -x RustDesk >/dev/null; then
            echo "RustDesk process: RUNNING"
          else
            echo "ERROR: RustDesk process is not running."
            exit 1
          fi

          echo
          echo "RustDesk processes:"
          pgrep -alf RustDesk || true

          echo
          echo "RustDesk ID:"
          echo "${RUSTDESK_ID:-unknown}"

          echo
          echo "Tailscale VPN IP:"
          echo "${TS_IP:-unknown}"

      # ============================================================
      # 11. Connection information
      # ============================================================
      - name: Connection Information
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================================================"
          echo "        REMOTE CONNECTION INFORMATION"
          echo "================================================"
          echo
          echo "RustDesk ID:"
          echo "${RUSTDESK_ID}"
          echo
          echo "RustDesk Password:"
          echo "${RUSTDESK_PASS}"
          echo
          echo "Tailscale VPN IP:"
          echo "${TS_IP}"
          echo
          echo "RustDesk VPN address:"
          echo "${TS_IP}"
          echo
          echo "RustDesk status:"
          pgrep -x RustDesk >/dev/null \
            && echo "RUNNING" \
            || echo "NOT RUNNING"
          echo
          echo "Tailscale status:"
          tailscale status || sudo tailscale status || true
          echo
          echo "================================================"

      # ============================================================
      # 12. Keep Mac runner alive
      # ============================================================
      - name: Keep Mac running
        shell: bash
        run: |
          set -euo pipefail

          echo "Remote session is ready."
          echo "Keeping runner alive..."

          while true; do

            if ! pgrep -x RustDesk >/dev/null; then
              echo "RustDesk stopped."

              echo "Restarting RustDesk..."

              open -a /Applications/RustDesk.app

              sleep 10
            fi

            if ! tailscale ip -4 >/dev/null 2>&1; then
              echo "Tailscale is not responding."

              sudo tailscale up \
                --authkey="${TS_AUTHKEY:-}" \
                --hostname="github-macos-rustdesk" \
                || true
            fi

            sleep 30
          done

      # ============================================================
      # 13. Disconnect Tailscale
      # ============================================================
      - name: Post Connect Tailscale
        if: always()
        shell: bash
        run: |
          sudo tailscale logout 2>/dev/null || true
