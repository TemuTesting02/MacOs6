name: MacRustDesk

on:
  workflow_dispatch:

jobs:
  mac:
    name: macOS Tailscale RustDesk
    runs-on: macos-latest

    steps:

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check Tailscale
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "TAILSCALE"
          echo "================================"

          tailscale status

          echo ""
          echo "VPN IP:"
          tailscale ip -4

      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "Downloading RustDesk..."

          URL=$(python3 -c '
          import json
          import urllib.request

          u="https://api.github.com/repos/rustdesk/rustdesk/releases/latest"

          with urllib.request.urlopen(u) as r:
              d=json.load(r)

          for a in d["assets"]:
              n=a["name"].lower()
              if n.endswith(".dmg") and ("aarch64" in n or "x86_64" in n or "arm64" in n):
                  print(a["browser_download_url"])
                  break
          ')

          echo "Download URL:"
          echo "$URL"

          curl -L --fail --retry 3 \
            "$URL" \
            -o "$RUNNER_TEMP/rustdesk.dmg"

          mkdir -p "$RUNNER_TEMP/rustdesk"

          hdiutil attach \
            "$RUNNER_TEMP/rustdesk.dmg" \
            -mountpoint "$RUNNER_TEMP/rustdesk" \
            -nobrowse \
            -readonly

          rm -rf "/Applications/RustDesk.app"

          cp -R \
            "$RUNNER_TEMP/rustdesk/RustDesk.app" \
            "/Applications/RustDesk.app"

          hdiutil detach \
            "$RUNNER_TEMP/rustdesk"

          echo "RustDesk installed."

      - name: Start RustDesk
        shell: bash
        run: |
          set -e

          APP="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$APP" ]; then
            echo "RustDesk executable not found."
            exit 1
          fi

          echo "Starting RustDesk..."

          nohup "$APP" \
            > "$RUNNER_TEMP/rustdesk.log" 2>&1 &

          sleep 10

          echo "RustDesk process:"
          pgrep -fl RustDesk || true

      - name: Get RustDesk ID
        shell: bash
        run: |
          set -e

          APP="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "Getting RustDesk ID..."

          ID=$("$APP" --get-id 2>/dev/null | tr -d '\r' | tail -n 1)

          if [ -z "$ID" ]; then
            echo ""
            echo "ERROR: RustDesk ID was not returned."
            echo ""
            echo "RustDesk log:"
            cat "$RUNNER_TEMP/rustdesk.log" || true
            exit 1
          fi

          echo "RUSTDESK_ID=$ID" >> "$GITHUB_ENV"

          echo "RustDesk ID detected."

      - name: Create Temporary Password
        shell: bash
        run: |
          set -e

          APP="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          PASS=$(openssl rand -hex 8)

          "$APP" --password "$PASS"

          echo "RUSTDESK_PASS=$PASS" >> "$GITHUB_ENV"

          echo "Temporary password created."

      - name: Verify RustDesk
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "RUSTDESK STATUS"
          echo "================================"

          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk ID:"
          echo "$RUSTDESK_ID"

          if [ -z "$RUSTDESK_ID" ]; then
            echo "RustDesk verification failed."
            exit 1
          fi

          echo ""
          echo "RustDesk ID verification OK."

      - name: Connection Information
        shell: bash
        run: |
          set -e

          VPN_IP=$(tailscale ip -4)
          HOST=$(hostname)

          echo ""
          echo "=========================================="
          echo "       CONNECTION INFORMATION"
          echo "=========================================="

          echo ""
          echo "Tailscale VPN"
          echo "------------------------------------------"
          echo "VPN IP   : $VPN_IP"
          echo "Hostname : $HOST"

          echo ""
          echo "RustDesk"
          echo "------------------------------------------"
          echo "Remote ID : $RUSTDESK_ID"
          echo "Password  : $RUSTDESK_PASS"

          echo ""
          echo "=========================================="
          echo "STATUS: READY"
          echo "=========================================="

      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "macOS runner is running."

          while true
          do
            echo "$(date): alive"
            sleep 60
          done
