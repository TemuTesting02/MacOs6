name: MacRustDesk

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest

    steps:

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install RustDesk without GUI installer
        shell: bash
        run: |
          set -e

          python3 > "$RUNNER_TEMP/rustdesk_url" <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/rustdesk/rustdesk/releases/latest",
              headers={"User-Agent": "GitHub-Actions"}
          )

          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          assets = data["assets"]

          for a in assets:
              n = a["name"].lower()

              if n.endswith(".dmg") and (
                  "arm64" in n or
                  "aarch64" in n or
                  "x86_64" in n
              ):
                  print(a["browser_download_url"])
                  break
          else:
              raise SystemExit("RustDesk DMG not found")
          PY

          URL="$(cat "$RUNNER_TEMP/rustdesk_url")"

          curl -fL "$URL" \
            -o "$RUNNER_TEMP/RustDesk.dmg"

          mkdir -p "$RUNNER_TEMP/rustdesk"

          hdiutil attach \
            "$RUNNER_TEMP/RustDesk.dmg" \
            -mountpoint "$RUNNER_TEMP/rustdesk" \
            -nobrowse \
            -readonly

          APP="$RUNNER_TEMP/rustdesk/RustDesk.app"

          test -d "$APP"

          rm -rf "$HOME/Applications/RustDesk.app"
          mkdir -p "$HOME/Applications"

          ditto "$APP" \
            "$HOME/Applications/RustDesk.app"

          hdiutil detach "$RUNNER_TEMP/rustdesk"

          echo "RUSTDESK=$HOME/Applications/RustDesk.app/Contents/MacOS/RustDesk" >> "$GITHUB_ENV"

      - name: Start RustDesk in current session
        shell: bash
        run: |
          set -e

          "$RUSTDESK" --server \
            > "$RUNNER_TEMP/rustdesk.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/rustdesk.pid"

          sleep 10

          pgrep -fl RustDesk || true

      - name: Create temporary RustDesk password
        shell: bash
        run: |
          set -e

          PASS="$(openssl rand -hex 8)"

          echo "Setting RustDesk password..."

          OUTPUT="$(
            "$RUSTDESK" --password "$PASS" 2>&1
          )"

          echo "$OUTPUT"

          if ! echo "$OUTPUT" | grep -qi "done"; then
            echo "Password was NOT accepted by RustDesk."
            exit 1
          fi

          echo "RUSTDESK_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Get and verify RustDesk ID
        shell: bash
        run: |
          set -e

          for i in {1..15}; do

            ID="$(
              "$RUSTDESK" --get-id 2>/dev/null |
              tr -d '\r' |
              tail -n 1
            )"

            if [ -n "$ID" ]; then
              break
            fi

            sleep 3
          done

          test -n "$ID"

          echo "RUSTDESK_ID=$ID" >> "$GITHUB_ENV"

          echo "RustDesk ID detected: $ID"

      - name: Connection Information
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "          CONNECTION READY"
          echo "========================================"
          echo ""
          echo "Tailscale IP:"
          tailscale ip -4
          echo ""
          echo "RustDesk ID:"
          echo "$RUSTDESK_ID"
          echo ""
          echo "RustDesk Password:"
          echo "$RUSTDESK_PASSWORD"
          echo ""
          echo "========================================"

      - name: Keep Mac Running
        shell: bash
        run: |
          while true; do
            sleep 60
          done
