name: MacRustDesk

on:
  workflow_dispatch:

jobs:
  mac:
    name: macOS + Tailscale + RustDesk
    runs-on: macos-latest

    steps:

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check Tailscale
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "TAILSCALE"
          echo "=============================="

          tailscale status

          echo ""
          echo "Tailscale IPv4:"
          tailscale ip -4

      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "Downloading RustDesk..."

          URL=$(python3 -c '
          import json
          import urllib.request

          url = "https://api.github.com/repos/rustdesk/rustdesk/releases/latest"

          with urllib.request.urlopen(url) as r:
              data = json.load(r)

          for asset in data["assets"]:
              name = asset["name"].lower()

              if name.endswith(".dmg") and (
                  "aarch64" in name
                  or "arm64" in name
                  or "x86_64" in name
              ):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("No RustDesk DMG found")
          ')

          echo "URL:"
          echo "$URL"

          curl -L \
            --fail \
            --retry 3 \
            "$URL" \
            -o "$RUNNER_TEMP/rustdesk.dmg"

          mkdir -p "$RUNNER_TEMP/rustdesk_mount"

          hdiutil attach \
            "$RUNNER_TEMP/rustdesk.dmg" \
            -mountpoint "$RUNNER_TEMP/rustdesk_mount" \
            -nobrowse \
            -readonly

          rm -rf "/Applications/RustDesk.app"

          cp -R \
            "$RUNNER_TEMP/rustdesk_mount/RustDesk.app" \
            "/Applications/RustDesk.app"

          hdiutil detach \
            "$RUNNER_TEMP/rustdesk_mount"

          echo "RustDesk installed."

      - name: Start RustDesk Server
        shell: bash
        run: |
          set -e

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -x "$RUSTDESK" ]; then
            echo "RustDesk executable not found."
            exit 1
          fi

          echo "Starting RustDesk server..."

          "$RUSTDESK" --server \
            > "$RUNNER_TEMP/rustdesk.log" 2>&1 &

          RUSTDESK_PID=$!

          echo "RUSTDESK_PID=$RUSTDESK_PID" >> "$GITHUB_ENV"

          sleep 10

          if ! kill -0 "$RUSTDESK_PID" 2>/dev/null; then
            echo "RustDesk server stopped unexpectedly."
            cat "$RUNNER_TEMP/rustdesk.log" || true
            exit 1
          fi

          echo "RustDesk server is running."

      - name: Set Temporary RustDesk Password
        shell: bash
        run: |
          set -e

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          # Temporary password
          PASS=$(openssl rand -hex 8)

          echo "Setting RustDesk password..."

          "$RUSTDESK" --password "$PASS"

          sleep 3

          # Save password for following steps
          echo "RUSTDESK_PASS=$PASS" >> "$GITHUB_ENV"

          echo "Temporary password has been configured."

      - name: Get RustDesk ID
        shell: bash
        run: |
          set -e

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "Getting RustDesk ID..."

          for i in {1..10}
          do
            ID=$(
              "$RUSTDESK" --get-id 2>/dev/null \
              | tr -d '\r' \
              | tail -n 1
            )

            if [ -n "$ID" ]; then
              break
            fi

            echo "Waiting for RustDesk ID..."
            sleep 3
          done

          if [ -z "$ID" ]; then
            echo ""
            echo "ERROR: RustDesk ID could not be obtained."
            echo ""
            echo "RustDesk log:"
            cat "$RUNNER_TEMP/rustdesk.log" || true
            exit 1
          fi

          echo "RUSTDESK_ID=$ID" >> "$GITHUB_ENV"

          echo "RustDesk ID detected."

      - name: Verify RustDesk
        shell: bash
        run: |
          set -e

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "=============================="
          echo "RUSTDESK VERIFICATION"
          echo "=============================="

          echo ""
          echo "Process:"
          pgrep -fl RustDesk || true

          echo ""
          echo "ID:"
          echo "$RUSTDESK_ID"

          echo ""
          echo "Testing password configuration..."

          if "$RUSTDESK" --get-id >/dev/null 2>&1; then
            echo "RustDesk is responding."
          else
            echo "RustDesk is not responding."
            exit 1
          fi

          if [ -z "$RUSTDESK_ID" ]; then
            echo "RustDesk ID is empty."
            exit 1
          fi

          if [ -z "$RUSTDESK_PASS" ]; then
            echo "RustDesk password is empty."
            exit 1
          fi

          echo ""
          echo "Verification OK."

      - name: Connection Information
        shell: bash
        run: |
          set -e

          VPN_IP=$(tailscale ip -4)
          HOST=$(hostname)

          echo ""
          echo "=========================================="
          echo "       CONNECTION INFORMATION"
          echo "=========================================="

          echo ""
          echo "Tailscale"
          echo "------------------------------------------"
          echo "VPN IP   : $VPN_IP"
          echo "Hostname : $HOST"

          echo ""
          echo "RustDesk"
          echo "------------------------------------------"
          echo "Remote ID : $RUSTDESK_ID"
          echo "Password  : $RUSTDESK_PASS"

          echo ""
          echo "=========================================="
          echo "STATUS: READY"
          echo "=========================================="

      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "macOS runner is running."

          while true
          do
            echo "$(date): macOS + Tailscale + RustDesk alive"
            sleep 60
          done
